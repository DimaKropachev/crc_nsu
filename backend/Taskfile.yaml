version: '3'

vars:
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.TASKFILE_DIR}}/bin'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint{{.EXE}}'
  GCI: '{{.BIN_DIR}}/gci{{.EXE}}'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt{{.EXE}}'

tasks:
  default:
    desc: 'Показывает доступные команды'
    cmds:
      - task --list

  run:
    desc: 'Запускает API с переменными окружения текущей оболочки'
    cmds:
      - go run ./cmd/api

  test:
    desc: 'Запускает все Go-тесты (интеграционные требуют TEST_DATABASE_URL)'
    cmds:
      - go test ./...

  build:
    desc: 'Собирает API в ./bin'
    cmds:
      - 'go build -o "{{.BIN_DIR}}/api{{.EXE}}" ./cmd/api'

  vet:
    desc: 'Запускает go vet'
    cmds:
      - go vet ./...

  migrate-up:
    desc: 'Применяет миграции (требует migrate и DATABASE_URL)'
    preconditions:
      - sh: 'test -n "$DATABASE_URL"'
        msg: 'Укажите DATABASE_URL в окружении.'
    cmds:
      - 'migrate -path migrations -database "$DATABASE_URL" up'

  migrate-down:
    desc: 'Откатывает миграции (требует migrate и DATABASE_URL)'
    preconditions:
      - sh: 'test -n "$DATABASE_URL"'
        msg: 'Укажите DATABASE_URL в окружении.'
    cmds:
      - 'migrate -path migrations -database "$DATABASE_URL" down'

  install-formatters:
    desc: 'Устанавливает форматтеры gci и gofumpt в ./bin'
    deps: [install-gofumpt, install-gci]

  install-gofumpt:
    internal: true
    env:
      GOBIN: '{{.BIN_DIR}}'
    cmds:
      - 'go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}'
    status:
      - 'test -f "{{.GOFUMPT}}"'

  install-gci:
    internal: true
    env:
      GOBIN: '{{.BIN_DIR}}'
    cmds:
      - 'go install github.com/daixiang0/gci@{{.GCI_VERSION}}'
    status:
      - 'test -f "{{.GCI}}"'

  format:
    aliases: [fmt]
    desc: 'Форматирует весь проект gofumpt + gci'
    deps: [install-formatters]
    cmds:
      - '"{{.GOFUMPT}}" -extra -w .'
      - '"{{.GCI}}" write --skip-generated -s standard -s default -s "prefix(career-consultations-backend)" .'

  install-golangci-lint:
    desc: 'Устанавливает golangci-lint в каталог bin'
    env:
      GOBIN: '{{.BIN_DIR}}'
    cmds:
      - 'go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}'
    status:
      - 'test -f "{{.GOLANGCI_LINT}}"'

  lint:
    desc: 'Запускает golangci-lint для всех модулей'
    deps: [install-golangci-lint]
    cmds:
      - '"{{.GOLANGCI_LINT}}" run ./... --config=.golangci.yml'

  check:
    desc: 'Проверяет линтер, vet, тесты и сборку без изменения исходников'
    cmds:
      - task: lint
      - task: vet
      - task: test
      - task: build
