services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_consultations
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d career_consultations"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://app:${POSTGRES_PASSWORD}@postgres:5432/career_consultations?sslmode=disable", "up"]
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/career_consultations?sslmode=disable
      FILE_STORAGE_DIR: /app/storage
      HTTP_ADDR: :8083
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8083}:8080"
    volumes:
      - resume_files:/app/storage
    restart: unless-stopped

volumes:
  postgres_data:
  resume_files:
