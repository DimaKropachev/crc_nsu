services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_consultations
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d career_consultations"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://app:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/career_consultations?sslmode=disable", "up"]
    restart: "no"

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/career_consultations?sslmode=disable
      FILE_STORAGE_DIR: /app/storage
      VK_APP_ID: ${VK_APP_ID:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      ADMIN_VK_IDS: ${ADMIN_VK_IDS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      REMINDER_ENABLED: ${REMINDER_ENABLED:-false}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-vk}
      NOTIFICATION_API_TOKEN: ${NOTIFICATION_API_TOKEN:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - resume_files:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  resume_files: